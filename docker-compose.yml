version: '3.8'

services:
  cynbit-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cynbit-backend-reference
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PORTAL_SIGNING_SECRET=cynbit-enterprise-audit-secret-key-32b
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
